[package]
name = "photorequest"
version = "0.2.0"
description = "Build, share, and print portable photo orders"
authors = ["PhotoRequest contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "photorequest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
open = "5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
